name: caca_palavra
description: "Word search game."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  flutter_riverpod: ^3.2.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3

dev_dependencies:
  build_runner: ^2.4.15
  freezed: ^3.2.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.10.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon_preview.png"  # (se existir; serve so como fallback/legacy)
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  adaptive_icon_background: "assets/icons/app_icon_background.png"
  adaptive_icon_foreground_inset: 20
  # opcional se o arquivo existir:
  adaptive_icon_monochrome: "assets/icons/app_icon_monochrome.png"

flutter:
  uses-material-design: true
  assets:
    - assets/puzzles/
    # Flutter nao inclui assets de subpastas automaticamente ao declarar apenas o diretorio pai.
    # Como os puzzles foram organizados em subpastas, precisamos lista-las aqui.
    - assets/puzzles/temas/
    - assets/puzzles/temas/starter/
    - assets/puzzles/temas/learning/
    - assets/puzzles/temas/standard/
    - assets/puzzles/temas/lib/
